<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1"
    />

      content="Nudge — a study planner that actually keeps you on track. Built for McGill students."
    />
    <title>Nudge — study planner for people who procrastinate</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%2317181a'/%3E%3Cpath d='M30 70V30l40 40V30' stroke='%23fff' stroke-width='9' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E"
    />
    <style>
      html { background: #f4f4f1; }
      @media (prefers-color-scheme: dark) { html { background: #0e0f10; } }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; }
      #boot i {
        width: 22px; height: 22px; border-radius: 50%;
        border: 2px solid rgba(128,128,128,.25); border-top-color: rgba(128,128,128,.7);
        animation: bs .7s linear infinite;
      }
      @keyframes bs { to { transform: rotate(360deg) } }
    </style>
    <script>
      try {
        var BG = {
          sand: ['#f4f4f1', '#0e0f10'],
          slate: ['#f1f3f6', '#0c0e12'],
          ocean: ['#edf4f7', '#071016'],
          forest: ['#eff4ed', '#0b100c'],
          plum: ['#f4f1f7', '#0f0c14'],
          rose: ['#f9f0f2', '#120b0e'],
        }
        var el = document.documentElement
        var t = localStorage.getItem('nudge.theme')
        var p = localStorage.getItem('nudge.palette')
        if (t === 'light' || t === 'dark') el.classList.add('theme-' + t)
        if (BG[p]) el.setAttribute('data-palette', p)
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        var bg = (BG[p] || BG.sand)[dark ? 1 : 0]
        el.style.background = bg
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', bg)
      } catch (e) {}

      try {
        if (!document.querySelector('meta[name="viewport"]')) {
          var m = document.createElement('meta')
          m.name = 'viewport'
          m.content = 'width=device-width, initial-scale=1, viewport-fit=cover'
          document.head.appendChild(m)
        }
      } catch (e) {}

      try {
        if (window.self !== window.top) {
          var floor = function () {
            var h = document.documentElement.clientHeight
            document.documentElement.style.height = h < 420 ? '720px' : ''
          }
          floor()
          addEventListener('resize', floor)
        }
      } catch (e) {}
    </script>
